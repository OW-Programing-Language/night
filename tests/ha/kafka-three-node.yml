# Disposable three-node combined KRaft cluster for CI fault injection only.
# Host listeners advertise loopback; production must use TLS/SASL and
# independent fault domains rather than three containers on one runner.
services:
  kafka-1:
    image: apache/kafka:3.9.1
    hostname: kafka-1
    ports:
      - "19092:19094"
    environment: &kafka-base
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9092,EXTERNAL://127.0.0.1:19092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_NODE_ID: "1"
  kafka-2:
    image: apache/kafka:3.9.1
    hostname: kafka-2
    ports:
      - "29092:19094"
    environment:
      <<: *kafka-base
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:9092,EXTERNAL://127.0.0.1:29092"
  kafka-3:
    image: apache/kafka:3.9.1
    hostname: kafka-3
    ports:
      - "39092:19094"
    environment:
      <<: *kafka-base
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:9092,EXTERNAL://127.0.0.1:39092"
