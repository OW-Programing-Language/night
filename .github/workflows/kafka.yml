name: Night Kafka broker integration

on:
  push:
    paths:
      - 'platform/**'
      - 'src/modules/messaging/NightKafka.ow'
      - '.github/workflows/kafka.yml'
  pull_request:
    paths:
      - 'platform/**'
      - 'src/modules/messaging/NightKafka.ow'
      - '.github/workflows/kafka.yml'

permissions:
  contents: read

jobs:
  kafka-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NIGHT_KAFKA_BOOTSTRAP_SERVERS: '127.0.0.1:9092'
      NIGHT_KAFKA_SECURITY_PROTOCOL: 'PLAINTEXT'
      NIGHT_KAFKA_ALLOW_INSECURE_LOOPBACK: 'true'
      NIGHT_JDBC_URL: 'jdbc:postgresql://localhost:5432/night'
      NIGHT_JDBC_USER: night_test
      NIGHT_JDBC_PASSWORD: night_test_ci_only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OW-Programing-Language/ow-lang
          path: ow-lang
          ref: 3be777a7ee2c9204ebe653d89e749e0dcfe4b831
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            ow-lang/pom.xml
            platform/pom.xml
      - name: Start ephemeral Kafka 3.9.1 KRaft broker
        run: docker run -d --name night-kafka -p 9092:9092 apache/kafka:3.9.1
      - name: Wait for broker metadata API
        run: |
          for attempt in $(seq 1 60); do
            if docker exec night-kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              echo "Kafka ready"
              exit 0
            fi
            sleep 2
          done
          docker logs night-kafka
          exit 1
      - name: Start ephemeral PostgreSQL 16 for transactional outbox
        run: |
          docker run -d --name night-postgres -p 5432:5432 \
            -e POSTGRES_USER=night_test \
            -e POSTGRES_PASSWORD=night_test_ci_only \
            -e POSTGRES_DB=night \
            postgres:16-alpine
          for attempt in $(seq 1 40); do
            if docker exec night-postgres pg_isready -U night_test -d night >/dev/null 2>&1; then
              echo "PostgreSQL ready"
              exit 0
            fi
            sleep 1
          done
          docker logs night-postgres
          exit 1
      - name: Install pinned OW compiler / runtime SPI
        run: mvn -B -q -f ow-lang/pom.xml install
      - name: Exercise real Kafka producer, group offsets and crash recovery
        run: mvn -B -f platform/pom.xml -Dtest=NightKafkaTest,NightOutboxDispatcherTest test
      - name: Broker logs on failure
        if: failure()
        run: |
          docker logs night-kafka || true
          docker logs night-postgres || true
