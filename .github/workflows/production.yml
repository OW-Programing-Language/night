name: Night Production Starters

on:
  push:
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIGHT_JDBC_URL: "jdbc:h2:mem:night_ci;DB_CLOSE_DELAY=-1"
      NIGHT_JDBC_USER: sa
      NIGHT_JDBC_PASSWORD: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OW-Programing-Language/ow-lang
          path: ow-lang
          ref: b5f037a4ab010071288a4dabeb2d8e7e1354c8f8
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            ow-lang/pom.xml
            platform/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and install OW with the extension SPI
        run: mvn -B -q -f ow-lang/pom.xml install
      - name: Run Night platform unit tests and package shaded plugin
        run: mvn -B -q -f platform/pom.xml package
      - name: Generate platform CycloneDX SBOM
        run: mvn -B -f platform/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DskipTests
      - name: Upload platform SBOM
        uses: actions/upload-artifact@v4
        with:
          name: night-platform-sbom
          path: |
            platform/target/bom.json
            platform/target/bom.xml
          if-no-files-found: error
      - name: Validate production example and imported native modules
        run: java -cp "ow-lang/target/OwIDE.jar:platform/target/night-platform-0.2.0-SNAPSHOT.jar" dev.oreo.Main check examples/production/main.ow
      - name: Verify manifest-based Night auto-configuration through real OW interpreter
        run: |
          java -cp "ow-lang/target/OwIDE.jar:platform/target/night-platform-0.2.0-SNAPSHOT.jar" dev.oreo.Main check examples/autoconfig/main.ow
          java -cp "ow-lang/target/OwIDE.jar:platform/target/night-platform-0.2.0-SNAPSHOT.jar" dev.oreo.Main run examples/autoconfig/main.ow | tee /tmp/night-autoconfig.log
          grep -q "PASS Night dependency-based auto-configuration" /tmp/night-autoconfig.log
      - name: Run live secured HTTP + JDBC smoke integration
        run: python3 tests/production_smoke.py
      - name: Verify annotated OW routes and transactional database atomicity
        run: python3 tests/mapped_transactions_smoke.py
      - name: Verify OW repository CRUD injection and JDBC transaction atomicity
        run: python3 tests/repositories_http_smoke.py

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: night_test
          POSTGRES_PASSWORD: night_test_ci_only
          POSTGRES_DB: night
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U night_test -d night"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: night_test
          RABBITMQ_DEFAULT_PASS: night_ci_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NIGHT_RABBITMQ_URL: amqp://night_test:night_ci_password@127.0.0.1:5672/%2F
      NIGHT_RABBITMQ_ALLOW_INSECURE_LOOPBACK: "true"
      NIGHT_RABBITMQ_QUEUE: night_ci_events
      NIGHT_REDIS_URL: redis://127.0.0.1:6379
      NIGHT_REDIS_ALLOW_INSECURE_LOOPBACK: "true"
      NIGHT_REDIS_NAMESPACE: night_ci
      NIGHT_JDBC_URL: jdbc:postgresql://localhost:5432/night
      NIGHT_JDBC_USER: night_test
      NIGHT_JDBC_PASSWORD: night_test_ci_only
      NIGHT_FAILOVER_RUN_ID: '${{ github.run_id }}'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OW-Programing-Language/ow-lang
          path: ow-lang
          ref: b5f037a4ab010071288a4dabeb2d8e7e1354c8f8
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            ow-lang/pom.xml
            platform/pom.xml
      - name: Install OW extension SPI
        run: mvn -B -q -f ow-lang/pom.xml install
      - name: Verify JDBC transaction and rollback behavior on PostgreSQL
        run: mvn -B -f platform/pom.xml -Dtest=NightIsolationTest,NightRepositoryTest,NightCrudRepositoryTest,NightOutboxTest,NightOutboxDispatcherTest,NightInboxTest,NightMultiWorkerRecoveryTest,NightConsumerBridgeTest,NightBrokerQuarantineTest,NightPoisonDlqTest,NightMessageSchemasTest,NightMessageSchemaIntegrationTest,NightRedisTest,NightRedisStreamsTest,NightCredentialStoreTest,NightSchedulerTest,NightRabbitMQTest test
      - name: Rehearse disposable PostgreSQL logical backup and restore
        run: bash tests/postgres_restore.sh
      - name: Persist RabbitMQ broker restart checkpoint and unacknowledged delivery
        run: mvn -B -f platform/pom.xml -Dtest=NightBrokerRestartTest -Dnight.failover.transport=rabbitmq -Dnight.failover.phase=before test
      - name: Restart real RabbitMQ service container
        run: |
          set -euo pipefail
          container="$(docker ps -q --filter ancestor=rabbitmq:4-management-alpine)"
          if [ -z "$container" ]; then
            echo "Cannot locate RabbitMQ CI service container"
            exit 1
          fi
          docker restart "$container"
          for attempt in $(seq 1 60); do
            if docker exec "$container" rabbitmq-diagnostics -q ping >/dev/null 2>&1; then
              echo "RabbitMQ recovered after restart"
              exit 0
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1
      - name: Verify RabbitMQ durable requeue and PostgreSQL dedup after restart
        run: mvn -B -f platform/pom.xml -Dtest=NightBrokerRestartTest -Dnight.failover.transport=rabbitmq -Dnight.failover.phase=after test
