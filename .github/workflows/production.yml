name: Night Production Starters

on:
  push:
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIGHT_JDBC_URL: "jdbc:h2:mem:night_ci;DB_CLOSE_DELAY=-1"
      NIGHT_JDBC_USER: sa
      NIGHT_JDBC_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OW-Programing-Language/ow-lang
          path: ow-lang
          ref: 3be777a7ee2c9204ebe653d89e749e0dcfe4b831
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            ow-lang/pom.xml
            platform/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and install OW with the extension SPI
        run: mvn -B -q -f ow-lang/pom.xml install
      - name: Run Night platform unit tests and package shaded plugin
        run: mvn -B -q -f platform/pom.xml package
      - name: Generate platform CycloneDX SBOM
        run: mvn -B -f platform/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DskipTests
      - name: Upload platform SBOM
        uses: actions/upload-artifact@v4
        with:
          name: night-platform-sbom
          path: |
            platform/target/bom.json
            platform/target/bom.xml
          if-no-files-found: error
      - name: Validate production example and imported native modules
        run: java -cp "ow-lang/target/OwIDE.jar:platform/target/night-platform-0.2.0-SNAPSHOT.jar" dev.oreo.Main check examples/production/main.ow
      - name: Run live secured HTTP + JDBC smoke integration
        run: python3 tests/production_smoke.py

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: night_test
          POSTGRES_PASSWORD: night_test_ci_only
          POSTGRES_DB: night
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U night_test -d night"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NIGHT_JDBC_URL: jdbc:postgresql://localhost:5432/night
      NIGHT_JDBC_USER: night_test
      NIGHT_JDBC_PASSWORD: night_test_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OW-Programing-Language/ow-lang
          path: ow-lang
          ref: 3be777a7ee2c9204ebe653d89e749e0dcfe4b831
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            ow-lang/pom.xml
            platform/pom.xml
      - name: Install OW extension SPI
        run: mvn -B -q -f ow-lang/pom.xml install
      - name: Verify JDBC transaction and rollback behavior on PostgreSQL
        run: mvn -B -f platform/pom.xml -Dtest=NightIsolationTest,NightRepositoryTest,NightOutboxTest test
