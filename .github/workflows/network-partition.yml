name: Night live broker network partitions and healing

on:
  push:
    paths:
      - 'tests/ha/**'
      - 'platform/**'
      - '.github/workflows/network-partition.yml'
  pull_request:
    paths:
      - 'tests/ha/**'
      - 'platform/**'
      - '.github/workflows/network-partition.yml'

permissions:
  contents: read

jobs:
  kafka-live-partition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: night_test
          POSTGRES_PASSWORD: night_test_ci_only
          POSTGRES_DB: night
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U night_test -d night"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NIGHT_HA_RUN_ID: '${{ github.run_id }}'
      NIGHT_KAFKA_BOOTSTRAP_SERVERS: '127.0.0.1:19092,127.0.0.1:29092,127.0.0.1:39092'
      NIGHT_KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      NIGHT_KAFKA_ALLOW_INSECURE_LOOPBACK: 'true'
      NIGHT_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/night
      NIGHT_JDBC_USER: night_test
      NIGHT_JDBC_PASSWORD: night_test_ci_only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OW-Programing-Language/ow-lang
          path: ow-lang
          ref: 3be777a7ee2c9204ebe653d89e749e0dcfe4b831
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            ow-lang/pom.xml
            platform/pom.xml
      - name: Boot three Kafka KRaft brokers with a shared Docker network
        run: |
          set -euo pipefail
          docker compose -p night-kafka-partition -f tests/ha/kafka-three-node.yml up -d
          for service in kafka-1 kafka-2 kafka-3; do
            ready=0
            for attempt in $(seq 1 80); do
              if docker compose -p night-kafka-partition -f tests/ha/kafka-three-node.yml exec -T "$service" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 2
            done
            test "$ready" -eq 1 || { echo "Kafka broker not ready: $service"; exit 1; }
          done
      - name: Install pinned OW runtime
        run: mvn -B -q -f ow-lang/pom.xml install
      - name: Persist committed Kafka offset and an unacknowledged replicated event
        run: mvn -B -f platform/pom.xml -Dtest=NightKafkaQuorumFailoverTest -Dnight.ha.phase=before "-Dnight.ha.leaderFile=$RUNNER_TEMP/kafka-partition-leader" test
      - name: Isolate actual Kafka partition leader, do not kill the broker process
        run: |
          set -euo pipefail
          leader="$(cat "$RUNNER_TEMP/kafka-partition-leader")"
          case "$leader" in 1|2|3) ;; *) echo "Invalid Kafka topic leader $leader"; exit 1 ;; esac
          echo "KAFKA_PARTITION_LEADER=$leader" >> "$GITHUB_ENV"
          bash tests/ha/network-partition.sh isolate night-kafka-partition tests/ha/kafka-three-node.yml "kafka-$leader"
      - name: Verify surviving Kafka majority elects leader and preserves stored data
        run: timeout 140s mvn -B -f platform/pom.xml -Dtest=NightKafkaQuorumFailoverTest -Dnight.ha.phase=after "-Dnight.ha.leaderFile=$RUNNER_TEMP/kafka-partition-leader" test
      - name: Heal Kafka isolated leader's network without restarting its process
        run: bash tests/ha/network-partition.sh heal night-kafka-partition tests/ha/kafka-three-node.yml "kafka-$KAFKA_PARTITION_LEADER"
      - name: Verify Kafka three ISR replicas, recovered consumer offsets and new write
        run: timeout 140s mvn -B -f platform/pom.xml -Dtest=NightKafkaQuorumFailoverTest -Dnight.ha.phase=return "-Dnight.ha.leaderFile=$RUNNER_TEMP/kafka-partition-leader" test
      - name: Identify the current Kafka topic leader for a live minority isolation
        run: mvn -B -f platform/pom.xml -Dtest=NightKafkaQuorumFailoverTest -Dnight.ha.phase=identify-minority-leader "-Dnight.ha.leaderFile=$RUNNER_TEMP/kafka-partition-minority" test
      - name: Isolate BOTH Kafka followers while keeping all three broker processes alive
        run: |
          set -euo pipefail
          leader="$(cat "$RUNNER_TEMP/kafka-partition-minority")"
          case "$leader" in 1|2|3) ;; *) echo "Invalid Kafka topic leader $leader"; exit 1 ;; esac
          echo "NIGHT_KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:${leader}9092" >> "$GITHUB_ENV"
          for node in 1 2 3; do
            if [ "$node" != "$leader" ]; then
              bash tests/ha/network-partition.sh isolate night-kafka-partition tests/ha/kafka-three-node.yml "kafka-$node"
            fi
          done
          echo "Only the running partition leader is network-reachable; two voters are isolated"
      - name: Verify isolated KRaft minority cannot confirm acks=all writes
        run: timeout 120s mvn -B -f platform/pom.xml -Dtest=NightKafkaQuorumFailoverTest -Dnight.ha.phase=minority "-Dnight.ha.leaderFile=$RUNNER_TEMP/kafka-partition-minority" test
      - name: Heal BOTH Kafka follower networks and restore full bootstrap set
        run: |
          set -euo pipefail
          for node in 1 2 3; do
            bash tests/ha/network-partition.sh heal night-kafka-partition tests/ha/kafka-three-node.yml "kafka-$node"
          done
          echo "NIGHT_KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:19092,127.0.0.1:29092,127.0.0.1:39092" >> "$GITHUB_ENV"
      - name: Verify healed Kafka cluster and stable-ID retry without a duplicate inbox row
        run: timeout 150s mvn -B -f platform/pom.xml -Dtest=NightKafkaQuorumFailoverTest -Dnight.ha.phase=healed "-Dnight.ha.leaderFile=$RUNNER_TEMP/kafka-partition-minority" test
      - name: Kafka partition diagnostics on failure
        if: failure()
        run: |
          docker compose -p night-kafka-partition -f tests/ha/kafka-three-node.yml ps || true
          docker compose -p night-kafka-partition -f tests/ha/kafka-three-node.yml logs --tail=160 || true
      - name: Restore Kafka Docker networks and dispose isolated cluster
        if: always()
        run: |
          for node in 1 2 3; do
            bash tests/ha/network-partition.sh heal night-kafka-partition tests/ha/kafka-three-node.yml "kafka-$node" || true
          done
          docker compose -p night-kafka-partition -f tests/ha/kafka-three-node.yml down -v --remove-orphans || true

  rabbitmq-live-partition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: night_test
          POSTGRES_PASSWORD: night_test_ci_only
          POSTGRES_DB: night
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U night_test -d night"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NIGHT_HA_RUN_ID: '${{ github.run_id }}'
      NIGHT_RABBITMQ_URL: 'amqp://night_test:night_ci_password@127.0.0.1:5672/%2F'
      NIGHT_RABBITMQ_ALLOW_INSECURE_LOOPBACK: 'true'
      NIGHT_RABBITMQ_QUEUE_TYPE: quorum
      NIGHT_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/night
      NIGHT_JDBC_USER: night_test
      NIGHT_JDBC_PASSWORD: night_test_ci_only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OW-Programing-Language/ow-lang
          path: ow-lang
          ref: 3be777a7ee2c9204ebe653d89e749e0dcfe4b831
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            ow-lang/pom.xml
            platform/pom.xml
      - name: Boot three live RabbitMQ nodes and wait for complete initialization
        run: |
          set -euo pipefail
          # Override applies pause_minority only to THIS live-partition lab.
          docker compose -p night-rmq-partition -f tests/ha/rabbitmq-three-node.yml -f tests/ha/rabbitmq-live-partition.override.yml up -d
          for port in 15672 15673 15674; do
            ready=0
            for attempt in $(seq 1 100); do
              if curl -fsS --max-time 3 -u night_test:night_ci_password "http://127.0.0.1:$port/api/overview" >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 2
            done
            test "$ready" -eq 1 || { echo "RabbitMQ management API not ready: $port"; exit 1; }
          done
      - name: Join all RabbitMQ nodes into one cluster
        run: |
          set -euo pipefail
          docker compose -p night-rmq-partition -f tests/ha/rabbitmq-three-node.yml exec -T rmq-2 rabbitmqctl join_cluster rabbit@rmq-1
          docker compose -p night-rmq-partition -f tests/ha/rabbitmq-three-node.yml exec -T rmq-3 rabbitmqctl join_cluster rabbit@rmq-1
          status="$(docker compose -p night-rmq-partition -f tests/ha/rabbitmq-three-node.yml exec -T rmq-1 rabbitmqctl cluster_status)"
          for node in 1 2 3; do echo "$status" | grep -F "rabbit@rmq-$node"; done
      - name: Verify all RabbitMQ brokers use the safe pause_minority partition policy
        run: |
          set -euo pipefail
          for service in rmq-1 rmq-2 rmq-3; do
            config="$(docker compose -p night-rmq-partition -f tests/ha/rabbitmq-three-node.yml exec -T "$service" rabbitmqctl environment)"
            echo "$config" | grep -E 'cluster_partition_handling,?\s*pause_minority|cluster_partition_handling.*pause_minority'
          done
      - name: Install pinned OW runtime
        run: mvn -B -q -f ow-lang/pom.xml install
      - name: Persist quorum messages, one acknowledged and one unacknowledged
        run: mvn -B -f platform/pom.xml -Dtest=NightRabbitQuorumFailoverTest -Dnight.ha.phase=before test
      - name: Identify the actual RabbitMQ quorum leader and isolate it alive
        run: |
          set -euo pipefail
          queue="night_qq_$NIGHT_HA_RUN_ID"
          status="$(docker compose -p night-rmq-partition -f tests/ha/rabbitmq-three-node.yml exec -T rmq-1 rabbitmq-queues quorum_status "$queue")"
          for node in 1 2 3; do echo "$status" | grep -F "rabbit@rmq-$node"; done
          definition="$(curl -fsS --retry 10 --retry-delay 2 -u night_test:night_ci_password "http://127.0.0.1:15672/api/queues/%2F/$queue")"
          echo "$definition" | jq -e '.type == "quorum"'
          leader="$(echo "$definition" | jq -r '.node // empty')"
          case "$leader" in
            rabbit@rmq-1) isolate=1; survivor_port=5673; survivor_management_port=15673 ;;
            rabbit@rmq-2) isolate=2; survivor_port=5672; survivor_management_port=15672 ;;
            rabbit@rmq-3) isolate=3; survivor_port=5672; survivor_management_port=15672 ;;
            *) echo "Unexpected queue leader: $leader"; exit 1 ;;
          esac
          echo "RABBIT_PARTITION_LEADER=$isolate" >> "$GITHUB_ENV"
          echo "RABBIT_ISOLATED_NODENAME=$leader" >> "$GITHUB_ENV"
          echo "RABBIT_SURVIVOR_MANAGEMENT_PORT=$survivor_management_port" >> "$GITHUB_ENV"
          bash tests/ha/network-partition.sh isolate night-rmq-partition tests/ha/rabbitmq-three-node.yml "rmq-$isolate"
          echo "NIGHT_RABBITMQ_URL=amqp://night_test:night_ci_password@127.0.0.1:$survivor_port/%2F" >> "$GITHUB_ENV"
      - name: Wait for real RabbitMQ network peer timeout and new quorum leader
        run: |
          set -euo pipefail
          queue="night_qq_$NIGHT_HA_RUN_ID"
          # Erlang distribution can take ~60 seconds to declare an
          # unreachable live peer down (net_tick_timeout). A new Raft
          # leader alone does not imply connections are yet safe to use.
          ready=0
          for attempt in $(seq 1 100); do
            nodes="$(curl -fsS --max-time 3 -u night_test:night_ci_password "http://127.0.0.1:$RABBIT_SURVIVOR_MANAGEMENT_PORT/api/nodes" 2>/dev/null || true)"
            definition="$(curl -fsS --max-time 3 -u night_test:night_ci_password "http://127.0.0.1:$RABBIT_SURVIVOR_MANAGEMENT_PORT/api/queues/%2F/$queue" 2>/dev/null || true)"
            if printf '%s' "$nodes" | jq -e --arg isolated "$RABBIT_ISOLATED_NODENAME" 'any(.[]; .name == $isolated and .running == false)' >/dev/null 2>&1 \
              && printf '%s' "$definition" | jq -e --arg isolated "$RABBIT_ISOLATED_NODENAME" '.type == "quorum" and (.node != $isolated) and (.node != null)' >/dev/null 2>&1; then
              echo "Surviving RabbitMQ majority detected peer loss and elected a different quorum leader"
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo "RabbitMQ did not stabilize a surviving majority"; exit 1; }
      - name: Verify surviving RabbitMQ majority publishes and preserves inbox integrity
        run: timeout 150s mvn -B -f platform/pom.xml -Dtest=NightRabbitQuorumFailoverTest -Dnight.ha.phase=after test
      - name: Heal isolated RabbitMQ leader without restarting its process
        run: bash tests/ha/network-partition.sh heal night-rmq-partition tests/ha/rabbitmq-three-node.yml "rmq-$RABBIT_PARTITION_LEADER"
      - name: Wait for all three live RabbitMQ cluster members to reconnect
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 100); do
            nodes="$(curl -fsS --max-time 3 -u night_test:night_ci_password "http://127.0.0.1:$RABBIT_SURVIVOR_MANAGEMENT_PORT/api/nodes" 2>/dev/null || true)"
            if printf '%s' "$nodes" | jq -e '([.[] | select(.running == true)] | length) >= 3' >/dev/null 2>&1; then
              echo "All three RabbitMQ processes are again healthy cluster members"
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo "Live RabbitMQ member failed to rejoin after healing"; exit 1; }
      - name: Verify RabbitMQ recovered quorum and acknowledged message
        run: timeout 150s mvn -B -f platform/pom.xml -Dtest=NightRabbitQuorumFailoverTest -Dnight.ha.phase=return test
      - name: Identify current RabbitMQ leader and isolate two followers alive
        run: |
          set -euo pipefail
          queue="night_qq_$NIGHT_HA_RUN_ID"
          definition=""
          for attempt in $(seq 1 45); do
            definition="$(curl -fsS --max-time 3 -u night_test:night_ci_password "http://127.0.0.1:15672/api/queues/%2F/$queue" 2>/dev/null || true)"
            if [ -n "$definition" ]; then break; fi
            sleep 2
          done
          echo "$definition" | jq -e '.type == "quorum"'
          leader="$(echo "$definition" | jq -r '.node // empty')"
          case "$leader" in
            rabbit@rmq-1) survivor=1; port=5672 ;;
            rabbit@rmq-2) survivor=2; port=5673 ;;
            rabbit@rmq-3) survivor=3; port=5674 ;;
            *) echo "Unknown RabbitMQ queue leader: $leader"; exit 1 ;;
          esac
          for node in 1 2 3; do
            if [ "$node" != "$survivor" ]; then
              bash tests/ha/network-partition.sh isolate night-rmq-partition tests/ha/rabbitmq-three-node.yml "rmq-$node"
            fi
          done
          echo "RABBIT_MINORITY_SURVIVOR=$survivor" >> "$GITHUB_ENV"
          echo "NIGHT_RABBITMQ_URL=amqp://night_test:night_ci_password@127.0.0.1:$port/%2F" >> "$GITHUB_ENV"
          echo "Actual queue leader remains network-attached; both other live members are disconnected"
      - name: Verify all three RabbitMQ processes are alive and minority network isolation is real
        run: |
          set -euo pipefail
          network="night-rmq-partition_default"
          docker network inspect "$network" >/dev/null
          case "$RABBIT_MINORITY_SURVIVOR" in 1|2|3) ;; *) echo "Invalid survivor"; exit 1 ;; esac
          for node in 1 2 3; do
            cid="$(docker compose -p night-rmq-partition -f tests/ha/rabbitmq-three-node.yml ps -q "rmq-$node")"
            test -n "$cid" || { echo "Missing broker rmq-$node"; exit 1; }
            running="$(docker inspect -f '{{.State.Running}}' "$cid")"
            test "$running" = true || { echo "Broker rmq-$node stopped; not a live partition"; exit 1; }
            attached="$(docker inspect "$cid" | jq -r --arg net "$network" '.[0].NetworkSettings.Networks | has($net)')"
            if [ "$node" = "$RABBIT_MINORITY_SURVIVOR" ]; then
              test "$attached" = true || { echo "Actual queue leader is not network-attached"; exit 1; }
            else
              test "$attached" = false || { echo "Follower rmq-$node is not isolated"; exit 1; }
            fi
            echo "rmq-$node: process running=$running, broker-network attached=$attached"
          done
          # No management-API running-node count here: RabbitMQ's test-only
          # pause_minority policy can intentionally stop its application,
          # making the HTTP management endpoint disappear on the minority.
          # Only a real unconfirmed publish in the next step proves safety.
      - name: Verify RabbitMQ minority cannot confirm new writes
        run: timeout 120s mvn -B -f platform/pom.xml -Dtest=NightRabbitQuorumFailoverTest -Dnight.ha.phase=minority test
      - name: Reconnect all RabbitMQ nodes without restarting any broker process
        run: |
          set -euo pipefail
          for node in 1 2 3; do
            bash tests/ha/network-partition.sh heal night-rmq-partition tests/ha/rabbitmq-three-node.yml "rmq-$node"
          done
      - name: Wait for RabbitMQ majority to reform after restoring both follower networks
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 100); do
            nodes="$(curl -fsS --max-time 3 -u night_test:night_ci_password "http://127.0.0.1:15672/api/nodes" 2>/dev/null || true)"
            if printf '%s' "$nodes" | jq -e '([.[] | select(.running == true)] | length) >= 3' >/dev/null 2>&1; then
              ready=1
              echo "RabbitMQ quorum restored with three live broker processes"
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo "RabbitMQ quorum failed to reform"; exit 1; }
      - name: Verify healed RabbitMQ quorum publishes and deduplicates original event ID
        run: timeout 150s mvn -B -f platform/pom.xml -Dtest=NightRabbitQuorumFailoverTest -Dnight.ha.phase=healed test
      - name: RabbitMQ network partition diagnostics on failure
        if: failure()
        run: |
          docker compose -p night-rmq-partition -f tests/ha/rabbitmq-three-node.yml ps || true
          docker compose -p night-rmq-partition -f tests/ha/rabbitmq-three-node.yml logs --tail=160 || true
      - name: Restore RabbitMQ Docker networks and dispose isolated cluster
        if: always()
        run: |
          for node in 1 2 3; do
            bash tests/ha/network-partition.sh heal night-rmq-partition tests/ha/rabbitmq-three-node.yml "rmq-$node" || true
          done
          docker compose -p night-rmq-partition -f tests/ha/rabbitmq-three-node.yml down -v --remove-orphans || true
